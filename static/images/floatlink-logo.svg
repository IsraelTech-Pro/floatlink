  </g>

  <g transform="translate(140,36)" fill="#0b0b0d">
    <text x="0" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="56" font-weight="800" letter-spacing="0.5">FloatLink</text>
    <rect x="2" y="64" width="220" height="6" rx="3" fill="url(#flGold)"/>
