<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140" role="img" aria-label="FloatLink">
  <defs>
    <linearGradient id="flGold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7d77a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8891a"/>
    </linearGradient>
    <filter id="flShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
