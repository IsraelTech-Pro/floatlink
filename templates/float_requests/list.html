{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h2 class="mb-0">My Requests</h2>
      <div class="text-muted">All float requests you created.</div>
    </div>
    <a class="btn btn-fl" href="{% url 'float_requests:create' %}">New Request</a>
  </div>

  <div class="card card-fl">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {% for r in requests %}
              <tr>
                <td>#{{ r.id }}</td>
                <td>GHS {{ r.amount }}</td>
                <td><span class="badge bg-light text-dark border">{{ r.get_status_display }}</span></td>
                <td class="text-muted">{{ r.created_at }}</td>
                <td><a class="btn btn-sm btn-fl-outline" href="{% url 'float_requests:detail' r.id %}">View</a></td>
              </tr>
            {% empty %}
              <tr><td colspan="5" class="text-muted">No requests yet.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
