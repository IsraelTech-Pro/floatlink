{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h2 class="mb-0">Chats</h2>
      <div class="text-muted">Your recent conversations.</div>
    </div>
    <a class="btn btn-fl-outline" href="{% url 'core:dashboard' %}">Back</a>
  </div>

  <div class="d-flex flex-column gap-2">
    {% for c in conversations %}
      <a class="text-decoration-none" href="{% url 'float_requests:detail' c.fr.id %}">
        <div class="card card-fl">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <div class="fw-semibold">Request #{{ c.fr.id }}</div>
              <div class="text-muted small">Request #{{ c.fr.id }} · {{ c.fr.get_status_display }}</div>
            </div>
            <span class="text-muted small">GHS {{ c.fr.amount }}</span>
          </div>
        </div>
      </a>
    {% empty %}
      <div class="card card-fl">
        <div class="card-body">
          <div class="text-muted">No chats yet.</div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
