{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FloatLink Ghana</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/floatlink-icon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
  </head>
  <body>
    {% include 'partials/navbar.html' %}

    <main>
      {% include 'partials/messages.html' %}
      {% block content %}{% endblock %}
    </main>

    <div class="modal fade" id="incomingRequestModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">New request</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="text-muted small mb-1">Requester</div>
            <div class="fw-semibold" id="incomingReqRequester">-</div>
            <div class="text-muted small mt-3 mb-1">Amount</div>
            <div class="fw-semibold" id="incomingReqAmount">-</div>
          </div>
          <div class="modal-footer">
            <a class="btn btn-fl" id="incomingReqOpenBtn" href="#">Open</a>
            <button type="button" class="btn btn-fl-outline" data-bs-dismiss="modal">Later</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/app.js' %}?v=20260219"></script>
  </body>
</html>
